<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ladybug Chat</title>
<style>
:root{--bg:#f6f3f4;--panel:#fff;--text:#1b1b1f;--mute:#777;--red:#d90429;--them:#ececf0;--line:#e3e0e2}
@media(prefers-color-scheme:dark){:root{--bg:#121014;--panel:#1c191f;--text:#f2f0f3;--mute:#9a959c;--them:#2b272e;--line:#322e35}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;background:var(--panel)}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-weight:600}
header button{margin-left:auto;padding:6px 12px;font-size:.8rem}
#list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;display:flex;flex-direction:column}.m.me{align-self:flex-end;align-items:flex-end}
.who,.t{font-size:.7rem;color:var(--mute);margin:2px 8px}
.b{padding:8px 13px;border-radius:18px;background:var(--them);overflow-wrap:anywhere;white-space:pre-wrap}
.me .b{background:var(--red);color:#fff}
.note{align-self:center;font-size:.75rem;color:var(--mute);text-align:center}
.bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
button{border:0;border-radius:22px;background:var(--red);color:#fff;padding:0 18px;font-size:1rem;cursor:pointer}
#join{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
#join h1{margin:0;font-size:2rem}#join input{flex:none;width:min(280px,80vw);text-align:center}#join button{padding:11px 28px}
</style>
</head>
<body>
<div id="join"><h1>🐞 Ladybug Chat</h1><input id="nm" placeholder="Your name" maxlength="20"><button id="go">Join</button></div>
<div id="app"><header>🐞 Ladybug Chat<button id="inv">Copy local link</button></header>
<div id="list"></div>
<div class="bar"><input id="in" placeholder="Type a message" maxlength="1000" autocomplete="off"><button id="send">Send</button></div></div>
<script>
const $=id=>document.getElementById(id),list=$('list');
// Room comes from the link after the # sign. No room yet? Make a random one.
let room=location.hash.slice(1);
if(!/^[a-z0-9]{8,32}$/.test(room)){room=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>(b%36).toString(36)).join('');history.replaceState(null,'','#'+room)}
// Fully local/offline mode: no Netlify, ntfy.sh, or external server.
const topic='ladybugchat-'+room;
const storageKey='ladybugchat-'+room;
let name='',cid='';try{name=localStorage.getItem('lbname')||'';cid=localStorage.getItem('lbcid')||''}catch(e){}
if(!cid){cid=Math.random().toString(36).slice(2);try{localStorage.setItem('lbcid',cid)}catch(e){} }
$('nm').value=name;
const seen=new Set();
function add(m){
 if(seen.has(m.id))return;seen.add(m.id);
 const d=document.createElement('div');d.className='m'+(m.c===cid?' me':'');
 const w=document.createElement('div');w.className='who';w.textContent=m.c===cid?'You':m.n;
 const b=document.createElement('div');b.className='b';b.textContent=m.t;
 const t=document.createElement('div');t.className='t';t.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 d.append(w,b,t);
 const stick=list.scrollTop+list.clientHeight>=list.scrollHeight-60;list.appendChild(d);if(stick||m.c===cid)list.scrollTop=list.scrollHeight}
function note(t){const d=document.createElement('div');d.className='note';d.textContent=t;list.appendChild(d)}
function loadMessages(){
  try{
    const msgs=JSON.parse(localStorage.getItem(storageKey)||'[]');
    msgs.forEach(m=>add(m));
  }catch(e){}
}
function saveMessage(m){
  try{
    const msgs=JSON.parse(localStorage.getItem(storageKey)||'[]');
    msgs.push(m);
    localStorage.setItem(storageKey,JSON.stringify(msgs.slice(-500)));
  }catch(e){}
}
function connect(){
  loadMessages();
  // Keep multiple tabs/windows on the same device synchronized.
  window.addEventListener('storage',e=>{
    if(e.key!==storageKey||!e.newValue)return;
    try{
      const msgs=JSON.parse(e.newValue);
      const last=msgs[msgs.length-1];
      if(last)add(last);
    }catch(_){ }
  });
}

function send(){
  const t=$('in').value.trim();
  if(!t)return;
  $('in').value='';
  const msg={id:Date.now()+Math.random().toString(16).slice(2),c:cid,n:name||'Guest',t,ts:Date.now()};
  add(msg);
  saveMessage(msg);
}
function start(){name=$('nm').value.trim().slice(0,20)||'Guest';try{localStorage.setItem('lbname',name)}catch(e){}
 $('join').remove();note('Offline mode: messages are saved on this device. No internet or Netlify is required.');connect();$('in').focus()}
$('go').onclick=start;$('nm').onkeydown=e=>{if(e.key==='Enter')start()};
$('send').onclick=send;$('in').onkeydown=e=>{if(e.key==='Enter')send()};
$('inv').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('inv').textContent='Copied!'}catch(e){prompt('Copy this link:',location.href)}setTimeout(()=>$('inv').textContent='Copy local link',1500)};
</script>
</body>
</html>
